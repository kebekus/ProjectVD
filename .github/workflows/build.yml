name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Installs elan from `lean-toolchain`, fetches the Mathlib olean cache, caches `.lake`
      # between runs (keyed on toolchain and manifest), and then runs
      #   lake build --wfail          -- linter warnings are errors
      #   lake lint                   -- Batteries environment linters, see `lintDriver` in lakefile
      #   lake exe mk_all --check --lib VD   -- every file under VD/ is imported from VD.lean
      # Fix a failing mk_all check locally with `lake exe mk_all --lib VD`.
      - name: Build, lint, and check imports
        uses: leanprover/lean-action@v1
        with:
          build-args: --wfail
          lint: true
          mk_all-check: true
          mk_all-args: --lib VD
